name: Build Web3Crawler DLL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile DLL
        run: |
          cl /LD /EHsc /std:c++17 /O2 Web3Crawler.cpp /Fe:Web3Crawler.dll /link /DEF:Web3Crawler.def winhttp.lib

      - name: Verify exports
        run: |
          dumpbin /exports Web3Crawler.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Web3Crawler
          path: Web3Crawler.dll
